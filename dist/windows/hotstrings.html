        top: 8px;
        width: 16px;
        height: 16px;
        fill: none;

        border: 0;

        height: 16px;

        top: var(--top);
        left: 0;
        right: 0;
        z-index: 1;
        height: 12px;
        background: linear-gradient(var(--bg), rgba(28, 27, 26, 0));

        opacity: 0;
      }

      }

        inset: var(--top) 0 0;
        overflow-y: scroll;
        padding: 0 2px 10px 10px;
      }

      main::-webkit-scrollbar {
        width: 16px;
      }

      main::-webkit-scrollbar-track {
        margin: 4px 0;
        background: transparent;
      }

        border: 4px solid transparent;
        border-radius: 8px;
        background: rgba(var(--accent-rgb), 0.5) padding-box;

  window.addEventListener("focus", () => input.focus());
  render();
  input.focus();
})();
</script>
