<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hotstrings</title>
    <style>
      :root {
        --bg: rgb(28, 27, 26);
        --text: rgb(242, 237, 230);
        --subtle: rgb(153, 145, 135);
        --faint: rgb(105, 97, 89);
        --accent-rgb: 242, 143, 46;
        --accent: rgb(var(--accent-rgb));
        --accent-text: rgb(255, 194, 128);
        --top: 62px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        font-size: 13px;
        user-select: none;
        cursor: default;
      }

      header {
        position: absolute;
        inset: 0 0 auto;
        z-index: 2;
        height: var(--top);
        background: var(--bg);
      }

      header::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(var(--accent-rgb), 0.7),
          rgba(var(--accent-rgb), 0.05)
        );
      }

      .field {
        position: absolute;
        top: 14px;
        left: 10px;
        right: 18px;
        height: 34px;
        display: flex;
        align-items: center;
        padding-right: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.06);
      }

      .field.active {
        border-color: rgba(var(--accent-rgb), 0.55);
      }

      .icon {
        position: absolute;
        left: 9px;
        top: 8px;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: var(--subtle);
        stroke-width: 1.6;
      }

      .field.active .icon {
        stroke: var(--accent);
      }

      .field input {
        flex: 1;
        min-width: 0;
        height: 100%;
        margin: 0 12px 0 33px;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        caret-color: var(--accent);
      }

      .field input::placeholder {
        color: var(--faint);
      }

      .count {
        color: var(--faint);
        font-size: 11px;
        white-space: nowrap;
      }

      .clear {
        display: none;
        width: 16px;
        height: 16px;
        margin-left: 8px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }

      .field.active .clear {
        display: block;
      }

      .clear svg {
        display: block;
        width: 16px;
        height: 16px;
        stroke: rgba(242, 237, 230, 0.8);
        stroke-width: 1.4;
      }

      .fade {
        position: absolute;
        top: var(--top);
        left: 0;
        right: 0;
        z-index: 1;
        height: 12px;
        background: linear-gradient(var(--bg), rgba(28, 27, 26, 0));
        pointer-events: none;
        opacity: 0;
      }

      .fade.on {
        opacity: 1;
      }

      main {
        position: absolute;
        inset: var(--top) 0 0;
        overflow-y: scroll;
        padding: 0 2px 10px 10px;
      }

      main::-webkit-scrollbar {
        width: 16px;
      }

      main::-webkit-scrollbar-track {
        margin: 4px 0;
        background: transparent;
      }

      main::-webkit-scrollbar-thumb {
        min-height: 28px;
        border: 4px solid transparent;
        border-radius: 8px;
        background: rgba(var(--accent-rgb), 0.5) padding-box;
      }

      main::-webkit-scrollbar-thumb:active {
        background-color: rgba(var(--accent-rgb), 0.9);
      }

      .group {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        height: 34px;
        padding: 0 10px 6px;
        color: var(--accent-text);
        font-size: 11px;
        font-weight: 600;
      }

      .group span {
        color: var(--faint);
        font-weight: 400;
      }

      .item {
        display: flex;
        align-items: center;
        height: 30px;
        margin: 1px 0;
        padding: 0 10px;
        border-radius: 7px;
      }

      .item:hover {
        background: rgba(var(--accent-rgb), 0.12);
      }

      .desc {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      mark {
        margin: 0 -1px;
        padding: 2px 1px;
        border-radius: 3px;
        background: rgba(var(--accent-rgb), 0.2);
        color: var(--accent-text);
      }

      .keys {
        display: flex;
        gap: 4px;
        margin-left: 16px;
      }

      kbd {
        min-width: 20px;
        height: 20px;
        padding: 0 7px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--subtle);
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        line-height: 20px;
        text-align: center;
      }

      .item.match kbd {
        background: rgba(var(--accent-rgb), 0.18);
        color: var(--accent-text);
      }

      .item:hover kbd {
        background: rgba(var(--accent-rgb), 0.32);
        color: var(--accent-text);
      }

      .empty {
        padding-top: 30px;
        text-align: center;
        color: var(--subtle);
      }

      .empty small {
        display: block;
        margin-top: 6px;
        color: var(--faint);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <label class="field" id="field">
        <svg class="icon" viewBox="0 0 16 16">
          <circle cx="7" cy="7" r="5" />
          <path d="M10.6 10.6 14 14" />
        </svg>
        <input id="search" placeholder="Search hotstrings" spellcheck="false" autocomplete="off" />
        <span class="count" id="count"></span>
        <button class="clear" id="clear" tabindex="-1" aria-label="Clear search">
          <svg viewBox="0 0 16 16"><path d="M5 5l6 6M11 5l-6 6" /></svg>
        </button>
      </label>
    </header>
    <div class="fade" id="fade"></div>
    <main id="list"></main>
    <!-- bundle -->
  </body>
</html>
